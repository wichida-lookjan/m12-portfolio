<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power Up! — Send Form Data to PHP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 760px">
    <h1 class="mb-3">Power Up! — Browser to Server</h1>
    <p>This is a separate practice form. It <strong>does not save</strong> Portfolio data yet.</p>
    <form action="receive.php" method="get" class="card card-body mb-4">
      <h2 class="h5">Try GET</h2>
      <label for="get-name" class="form-label">Display name</label>
      <input id="get-name" name="displayName" class="form-control mb-3" required>
      <button class="btn btn-outline-primary">Send with GET</button>
    </form>
    <form action="receive.php" method="post" class="card card-body">
      <h2 class="h5">Try POST</h2>
      <label for="post-name" class="form-label">Display name</label>
      <input id="post-name" name="displayName" class="form-control mb-3" required>
      <button class="btn btn-primary">Send with POST</button>
    </form>
    <p class="mt-3 text-muted">Open Developer Tools → Network and compare the requests.</p>
  </main>
</body>
</html>
